plugins {
    id 'java'
    id 'java-library' // For a Java library project
    id 'maven-publish' // For publishing to Maven repositories
}

group = 'com.github.mirko0'
version = '0.5.1'
description = 'Annotation Command Processor for Discord Java API'

// The language level is part of the API: raising it breaks every consumer on an older JDK.
// `release` validates against the real Java 17 API rather than just emitting 17 bytecode, so a
// Java 21 method cannot slip in while building on a Java 21 toolchain.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-Xlint:-processing'
}

repositories {
    mavenCentral()
}

dependencies {
    // compileOnly: the consumer brings their own JDA, so the library never drags a second
    // version into their build. slf4j-api arrives transitively and is the only other thing used.
    compileOnly 'net.dv8tion:JDA:6.2.0'
    // Nullability annotations on the public API. CLASS retention, so nothing is needed at runtime
    // and nothing reaches the consumer's classpath.
    compileOnly 'org.jetbrains:annotations:24.1.0'

    testImplementation 'net.dv8tion:JDA:6.2.0'
    testCompileOnly 'org.jetbrains:annotations:24.1.0'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.13'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// Configure Javadoc generation
javadoc {
    options.encoding = 'UTF-8' // Ensure proper encoding
    options.charSet = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet') // Suppress strict doclint warnings (optional)
}
// Create a Javadoc JAR
tasks.register('javadocJar', Jar) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
    dependsOn javadoc
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java // Publishes the main JAR and the sources JAR
            artifact javadocJar // Publishes the Javadoc JAR
            groupId = project.group
            artifactId = 'command-processor'
            version = project.version
            pom {
                name = 'Command Processor'
                description = project.description
                url = 'https://github.com/mirko0/commandprocessor'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
            }
        }
    }
    repositories {
        mavenLocal() // Publishes to ~/.m2/repository
        // GitHub Packages, used by .github/workflows/publish.yml on a version tag. The credentials
        // come from the environment (the workflow's GITHUB_ACTOR and GITHUB_TOKEN with packages:
        // write) or from gpr.user / gpr.key in ~/.gradle/gradle.properties. publishToMavenLocal
        // never touches this repository, so a local build needs no token.
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/mirko0/CommandProcessor')
            credentials {
                username = findProperty('gpr.user') ?: System.getenv('GITHUB_ACTOR')
                password = findProperty('gpr.key') ?: System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
